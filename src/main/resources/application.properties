spring.application.name=EcommerceApi
# MySQL Core Datasource Connectivity Parameters
spring.datasource.url=jdbc:mysql://localhost:3306/techstore_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_root_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Execution Infrastructure Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect